[project]
name = "pos-backend"
version = "1.0.0"
description = "POS System Backend - FastAPI + SQLAlchemy 2.0"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "POS System Team", email = "team@pos.local"}
]
dependencies = [
    # Web Framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    
    # Database
    "sqlalchemy==2.0.30",
    "asyncmy==0.2.7",
    "alembic==1.12.1",
    
    # Validation & Settings
    "pydantic==2.7.4",
    "pydantic-settings==2.3.3",
    "pydantic-extra-types==2.7.0",
    
    # Auth & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "bcrypt==4.1.2",
    
    # HTTP Client
    "httpx==0.27.0",
    
    # Utilities
    "python-multipart==0.0.9",
    "email-validator==2.1.0",
    "python-dateutil==2.9.0",
    "pytz==2024.1",
    
    # XML for FDE
    "lxml==4.9.3",
    "xmlschema==3.2.0",
    "xmlsec==1.3.14",
    
    # Background Tasks
    "arq==0.26.0",
    "redis==5.0.1",
    
    # Testing (also in dev)
    "pytest==8.2.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "httpx==0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "ipython==8.25.0",
    "debugpy==1.8.1",
]
test = [
    "pytest==8.2.1",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.14.0",
    "factory-boy==3.3.0",
    "faker==27.2.0",
    "testcontainers==4.6.0",
]

[tool.poetry]
name = "pos-backend"
version = "1.0.0"
description = "POS System Backend"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4"
mypy = "^1.10"
pre-commit = "^3.7"
ipython = "^8.25"
debugpy = "^1.8"

[tool.poetry.group.test.dependencies]
pytest = "^8.2"
pytest-asyncio = "^0.23"
pytest-cov = "^4.1"
pytest-mock = "^3.14"
factory-boy = "^3.3"
faker = "^27.2"
testcontainers = "^4.6"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
]
per-file-ignores = {
    "tests/*": ["S101", "S106"],  # allow assert and hardcoded passwords in tests
}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]